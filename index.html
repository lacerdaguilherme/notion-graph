<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Graph</title>
<style>
  :root { --bg:#0f0f12; --fg:#e8e8ec; --dim:#8a8a94; --panel:rgba(22,22,28,.92); --border:#2a2a33; --accent:#7c9cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden; }
  #graph { position:absolute; inset:0; }
  .panel { position:absolute; z-index:5; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; backdrop-filter:blur(6px); }
  #controls { top:12px; left:12px; width:260px; display:flex; flex-direction:column; gap:8px; }
  #controls input[type=search] { width:100%; padding:7px 9px; border-radius:7px; border:1px solid var(--border); background:#15151a; color:var(--fg); outline:none; font-size:13px; }
  #controls input[type=search]:focus { border-color:var(--accent); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--dim); }
  .row label { display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
  .sw { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #status { position:absolute; bottom:12px; left:12px; color:var(--dim); font-size:12px; display:flex; gap:12px; align-items:center; }
  #status b { color:var(--fg); font-weight:600; }
  #hint { position:absolute; bottom:12px; right:12px; color:var(--dim); font-size:12px; text-align:right; }
  button { background:#1c1c23; color:var(--fg); border:1px solid var(--border); border-radius:7px; padding:5px 9px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  #lock { position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:var(--bg); }
  #lock form { width:320px; display:flex; flex-direction:column; gap:10px; }
  #lock input { padding:9px 10px; border-radius:7px; border:1px solid var(--border); background:#15151a; color:var(--fg); font-size:14px; }
  #lock .err { color:#ff7a7a; min-height:1.2em; font-size:12px; }
  #tip { position:absolute; z-index:6; pointer-events:none; display:none; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 10px; max-width:280px; }
  #tip .t { font-weight:600; }
  #tip .m { color:var(--dim); font-size:12px; margin-top:2px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div id="graph"></div>

<div id="controls" class="panel">
  <input id="q" type="search" placeholder="Search pages…  ( / )" autocomplete="off">
  <div class="row">
    <label><input type="checkbox" data-kind="parent" checked><span class="sw" style="background:#5f6b85"></span>parent</label>
    <label><input type="checkbox" data-kind="relation" checked><span class="sw" style="background:#f2b36b"></span>relation</label>
    <label><input type="checkbox" data-kind="mention" checked><span class="sw" style="background:#7cd992"></span>mention</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="orphans" checked>orphans</label>
    <label><input type="checkbox" id="labels">always label</label>
    <button id="fit" title="zoom to fit">fit</button>
    <button id="relayout" title="forget saved positions and re-run the layout">re-layout</button>
  </div>
</div>

<div id="status"><span><b id="nN">0</b> nodes</span><span><b id="nE">0</b> edges</span><span id="gen"></span></div>
<div id="hint">scroll to zoom · drag to pan · click opens in Notion<br><span id="src"></span></div>
<div id="tip"><div class="t"></div><div class="m"></div></div>

<div id="lock">
  <form id="lockForm">
    <div style="font-size:18px;font-weight:600">Notion Graph</div>
    <div style="color:var(--dim)">This graph is encrypted. Enter the password to view it.</div>
    <input id="pw" type="password" placeholder="password" autofocus>
    <label style="color:var(--dim)"><input type="checkbox" id="remember" checked> remember on this device</label>
    <button type="submit">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1.47.0/dist/force-graph.min.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const LS = { graph:'ng:graph', pos:'ng:pos', pw:'ng:pw' };
  const COLORS = { page:'#d9d9e3', database:'#f2b36b', edge:{ parent:'#5f6b85', relation:'#f2b36b', mention:'#7cd992' } };
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} },
    del(k){ try { localStorage.removeItem(k); } catch {} },
  };

  // ---------- state ----------
  let graph = null;           // {generatedAt,nodes,links}
  let fg = null;
  let hover = null;
  const neighbors = new Map(); // id -> Set(id)
  const kinds = { parent:true, relation:true, mention:true };
  let query = '';
  let showOrphans = true;
  let alwaysLabel = false;
  let positions = {};
  try { positions = JSON.parse(ls.get(LS.pos) || '{}'); } catch {}

  // ---------- loading ----------
  async function load() {
    // 1. instant render from local cache
    const cached = ls.get(LS.graph);
    if (cached) { try { setGraph(JSON.parse(cached), 'local cache'); } catch {} }
    // 2. revalidate (ETag makes this cheap when unchanged)
    try {
      const res = await fetch('data.json', { cache:'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const body = await res.json();
      const fresh = body.encrypted ? await unlock(body) : body;
      if (!fresh) return;
      if (!graph || fresh.generatedAt !== graph.generatedAt) {
        ls.set(LS.graph, JSON.stringify(fresh));
        setGraph(fresh, 'network');
      } else {
        $('#src').textContent = 'up to date';
      }
    } catch (e) {
      if (!graph) {
        $('#src').innerHTML = 'no data yet. run the <b>build graph</b> workflow once. (' + e.message + ')';
      } else $('#src').textContent = 'offline · showing cached graph';
    }
  }

  async function unlock(env) {
    const tryPw = async (pw) => {
      const enc = new TextEncoder();
      const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(env.salt), iterations:env.iterations, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(env.iv) }, key, b64(env.data));
      let bytes = plain;
      if (env.gzip) bytes = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(bytes));
    };
    const saved = ls.get(LS.pw);
    if (saved) { try { return await tryPw(saved); } catch { ls.del(LS.pw); } }
    return new Promise((resolve) => {
      const lock = $('#lock'); lock.style.display = 'flex'; $('#pw').focus();
      $('#lockForm').onsubmit = async (ev) => {
        ev.preventDefault();
        $('#lockErr').textContent = '';
        try {
          const g = await tryPw($('#pw').value);
          if ($('#remember').checked) ls.set(LS.pw, $('#pw').value);
          lock.style.display = 'none';
          resolve(g);
        } catch { $('#lockErr').textContent = 'wrong password'; }
      };
    });
  }

  // ---------- graph ----------
  function setGraph(g, source) {
    graph = g;
    neighbors.clear();
    for (const n of g.nodes) neighbors.set(n.id, new Set());
    for (const l of g.links) { neighbors.get(l.source)?.add(l.target); neighbors.get(l.target)?.add(l.source); }
    let havePos = 0;
    for (const n of g.nodes) { const p = positions[n.id]; if (p) { n.x = p[0]; n.y = p[1]; havePos++; } }
    const warm = havePos > g.nodes.length * 0.8;
    $('#gen').textContent = 'updated ' + rel(g.generatedAt);
    $('#src').textContent = 'loaded from ' + source + (warm ? ' · saved layout' : '');
    if (!fg) fg = makeGraph();
    fg.warmupTicks(warm ? 0 : 60).cooldownTicks(warm ? 80 : 300);
    fg.d3Force('charge').strength(-40);
    fg.d3Force('link').distance((l) => l.kind === 'parent' ? 28 : 50);
    apply();
    if (!warm) setTimeout(() => fg.zoomToFit(600, 40), 900);
  }

  function makeGraph() {
    const el = $('#graph');
    const f = ForceGraph()(el)
      .width(el.clientWidth || innerWidth).height(el.clientHeight || innerHeight)
      .backgroundColor('#0f0f12')
      .nodeId('id')
      .nodeVal((n) => 1 + Math.sqrt(n.degree || 0))
      .nodeLabel(() => '')
      .linkColor((l) => alpha(COLORS.edge[l.kind] || '#888', linkDim(l) ? .06 : .45))
      .linkWidth((l) => hover && (l.source.id === hover.id || l.target.id === hover.id) ? 2 : 1)
      .linkDirectionalParticles(0)
      .nodeCanvasObjectMode(() => 'replace')
      .nodeCanvasObject((n, ctx, scale) => {
        const r = 2.2 + Math.sqrt(n.degree || 0) * 1.4;
        const dim = nodeDim(n);
        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2*Math.PI);
        ctx.fillStyle = alpha(COLORS[n.type] || COLORS.page, dim ? .12 : 1);
        ctx.fill();
        if (isMatch(n) && query) { ctx.strokeStyle = '#7c9cff'; ctx.lineWidth = 1.5/scale; ctx.stroke(); }
        const showLabel = !dim && (alwaysLabel || scale > 2.2 || (hover && (hover.id === n.id || neighbors.get(hover.id)?.has(n.id))) || (query && isMatch(n)) || n.degree >= 12);
        if (showLabel) {
          const fs = Math.max(10/scale, 2.5);
          ctx.font = `${n.type==='database'?'600 ':''}${fs}px -apple-system,Segoe UI,Roboto,sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillStyle = alpha('#e8e8ec', hover && hover.id !== n.id && !neighbors.get(hover.id)?.has(n.id) ? .35 : .95);
          const label = (n.icon ? n.icon + ' ' : '') + trunc(n.title, 40);
          ctx.fillText(label, n.x, n.y + r + 1.5/scale);
        }
      })
      .nodePointerAreaPaint((n, color, ctx) => { const r = 2.2 + Math.sqrt(n.degree||0)*1.4 + 2; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2*Math.PI); ctx.fill(); })
      .onNodeHover((n) => { hover = n; el.style.cursor = n ? 'pointer' : null; tip(n); })
      .onNodeClick((n) => window.open(n.url, '_blank', 'noopener'))
      .onNodeDragEnd((n) => { n.fx = n.x; n.fy = n.y; savePositions(); })
      .onBackgroundClick(() => { if ($('#q').value) { $('#q').value=''; query=''; apply(); } })
      .onEngineStop(() => savePositions())
      .onZoom(() => { if (hover) tip(null); });
    window.addEventListener('resize', () => f.width(el.clientWidth).height(el.clientHeight));
    return f;
  }

  function visibleData() {
    const vis = new Set(graph.nodes.map(n => n.id));
    const links = graph.links.filter((l) => kinds[l.kind]);
    if (!showOrphans) {
      const deg = new Map();
      for (const l of links) { deg.set(l.source, 1); deg.set(l.target, 1); }
      for (const n of graph.nodes) if (!deg.has(n.id)) vis.delete(n.id);
    }
    const nodes = graph.nodes.filter((n) => vis.has(n.id));
    // force-graph mutates link source/target into objects; give it fresh copies each time
    return { nodes, links: links.filter((l) => vis.has(l.source) && vis.has(l.target)).map((l) => ({ ...l })) };
  }

  function apply() {
    const d = visibleData();
    fg.graphData(d);
    $('#nN').textContent = d.nodes.length.toLocaleString();
    $('#nE').textContent = d.links.length.toLocaleString();
  }

  // ---------- dimming ----------
  const isMatch = (n) => !query || (n.title || '').toLowerCase().includes(query);
  function nodeDim(n) {
    if (hover) return !(hover.id === n.id || neighbors.get(hover.id)?.has(n.id));
    if (query) return !isMatch(n);
    return false;
  }
  function linkDim(l) {
    const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
    if (hover) return !(s === hover.id || t === hover.id);
    if (query) { const a = byId(s), b = byId(t); return !(a && b && isMatch(a) && isMatch(b)); }
    return false;
  }
  const idx = new Map();
  function byId(id) { if (!idx.size && graph) for (const n of graph.nodes) idx.set(n.id, n); return idx.get(id); }

  // ---------- positions ----------
  let saveT;
  function savePositions() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      const { nodes } = fg.graphData();
      for (const n of nodes) if (Number.isFinite(n.x)) positions[n.id] = [Math.round(n.x*10)/10, Math.round(n.y*10)/10];
      ls.set(LS.pos, JSON.stringify(positions));
    }, 300);
  }

  // ---------- ui ----------
  function tip(n) {
    const t = $('#tip');
    if (!n) { t.style.display = 'none'; return; }
    t.querySelector('.t').textContent = (n.icon ? n.icon + ' ' : '') + n.title;
    t.querySelector('.m').textContent = `${n.type} · ${n.degree} link${n.degree===1?'':'s'} · edited ${rel(n.lastEdited)}`;
    t.style.left = (mouse.x + 14) + 'px'; t.style.top = (mouse.y + 14) + 'px';
    t.style.display = 'block';
  }
  const mouse = { x: 0, y: 0 };
  document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; const t = $('#tip'); if (t.style.display === 'block') { t.style.left = (e.clientX + 14) + 'px'; t.style.top = (e.clientY + 14) + 'px'; } });
  $('#q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); idx.clear(); fg && fg.graphData(fg.graphData()); });
  document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } if (e.key === 'Escape') { $('#q').value=''; query=''; $('#q').blur(); fg && fg.graphData(fg.graphData()); } });
  for (const cb of document.querySelectorAll('input[data-kind]')) cb.addEventListener('change', () => { kinds[cb.dataset.kind] = cb.checked; apply(); });
  $('#orphans').addEventListener('change', (e) => { showOrphans = e.target.checked; apply(); });
  $('#labels').addEventListener('change', (e) => { alwaysLabel = e.target.checked; fg && fg.graphData(fg.graphData()); });
  $('#fit').addEventListener('click', () => fg && fg.zoomToFit(500, 40));
  $('#relayout').addEventListener('click', () => { positions = {}; ls.del(LS.pos); for (const n of graph.nodes) { delete n.x; delete n.y; delete n.fx; delete n.fy; } setGraph(graph, 'memory'); fg.d3ReheatSimulation(); });

  // ---------- utils ----------
  function alpha(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
  function trunc(s, n) { s = s || 'Untitled'; return s.length > n ? s.slice(0, n-1) + '…' : s; }
  function rel(iso) {
    if (!iso) return '?';
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s/60) + ' min ago';
    if (s < 86400) return Math.round(s/3600) + ' h ago';
    if (s < 86400*30) return Math.round(s/86400) + ' d ago';
    return new Date(iso).toLocaleDateString();
  }

  load();
})();
</script>
</body>
</html>
